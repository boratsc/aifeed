[project]
name = "aifeed"
version = "0.1.0"
description = "AI news aggregator: fetch, LLM triage/dedup/editorial, static Polish digest"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "Markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aifeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
